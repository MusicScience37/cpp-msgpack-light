[project]
name = "cpp-msgpack-light"
version = "0.0.0"
description = ""
readme = "README.md"
authors = [
    { name = "Kenta Kabashima", email = "kenta_program37@hotmail.co.jp" },
]
requires-python = ">=3.12,<3.14"
dependencies = ["setuptools (>=83.0.0,<84.0.0)"]

[tool.poetry]
packages = []
package-mode = false

[tool.poetry.group.doc.dependencies]
sphinx = "^9.1.0"
sphinx-orange-book-theme = "^0.21.0"
sphinxcontrib-plantuml = "^0.31"
myst-parser = "^5.1.0"
breathe = "^4.36.0"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
isort = "^8.0.1"
click = "^8.4.2"
cmakelang = "^0.6.13"
doc8 = "^2.0.0"
pre-commit = "^4.6.0"
sphinx-autobuild = "^2025.8.25"
clang-tidy-checker = "^0.6.0"
lcov_cobertura = "^2.1.1"
commitizen = "^4.16.4"
tqdm = "^4.68.4"
jinja2 = "^3.1.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.main]
disable = "too-many-instance-attributes,line-too-long"
